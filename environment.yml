# Conda environment for EFGPP itself (the Python application only).
#
# Fastest:  mamba env create -f environment.yml      (or: micromamba create -f environment.yml)
# Also:     conda env create -f environment.yml       (conda >= 23.10 uses the same libmamba solver)
#
#   conda activate efgpp        # or: mamba activate efgpp
#   efgpp --version
#
# Every dependency comes pre-built from conda-forge in a single solve with parallel downloads;
# pip only links the EFGPP source in editable mode (all requirements are already satisfied, so
# it downloads nothing but the small build backend).
#
# Scientific tools (PLINK 2, VEP, MetaXcan, ...) are NOT installed here: `efgpp setup data`
# creates a separate small environment per purpose inside each project and EFGPP switches
# between them automatically.
name: efgpp
channels:
  - conda-forge
  - bioconda   # pyliftover
  - nodefaults  # never Anaconda's commercial defaults channel
dependencies:
  - python=3.12
  - pip
  # core (mirrors [project.dependencies] in pyproject.toml)
  - pydantic>=2.6
  - typer>=0.12
  - rich>=13.7
  - pyyaml>=6.0
  - polars>=1.0
  - pyarrow>=15
  - python-duckdb>=1.0
  - pandera-polars>=0.20
  - fsspec>=2024.2
  - httpx>=0.27
  - tenacity>=8.2
  - numpy>=1.26
  - scipy>=1.11
  - plotly>=5.20
  - jinja2>=3.1
  - filelock>=3.13
  - platformdirs>=4.2
  - psutil>=5.9
  - uv>=0.4
  - pyliftover>=0.4.1
  # extra: omics
  - anndata>=0.10
  - mudata>=0.3
  - zarr>=2.16
  # extra: test
  - pytest>=8
  - pytest-cov>=5
  - hypothesis>=6.100
  - pip:
      - -e .[omics,test]
