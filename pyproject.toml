[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "efgpp"
version = "0.1.0"
description = "EFGPP - Exploratory Framework for Genotype-Phenotype Prediction (Data layer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Muneeb Siddique" }]
keywords = ["genomics", "genotype", "phenotype", "multi-omics", "provenance", "PLINK2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pandera[polars]>=0.20",
    "fsspec>=2024.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "plotly>=5.20",
    "jinja2>=3.1",
    "filelock>=3.13",
    "platformdirs>=4.2",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Omics matrices (AnnData / Zarr / MuData). Without these, omics are stored as Parquet.
omics = ["anndata>=0.10", "mudata>=0.3", "zarr>=2.16"]
# Static figure export and UpSet PNGs for the report.
reporting = ["kaleido>=0.2", "upsetplot>=0.9"]
# Fast local integrity scanning.
fast = ["blake3>=0.4"]
# GA4GH standards (Phenopackets validation, VRS identifiers).
standards = ["phenopackets>=2.0", "ga4gh.vrs[extras]>=2.0"]
# Optional regulatory annotation client.
alphagenome = ["alphagenome"]
all = ["efgpp[omics,reporting,fast]"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
    "anndata>=0.10",
    "mudata>=0.3",
    "zarr>=2.16",
    "blake3>=0.4",
]

[project.scripts]
efgpp = "efgpp.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/efgpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end acceptance tests on tiny synthetic cohorts",
    "network: tests that contact live services (deselected by default)",
    "plink2: tests that need a real plink2 executable",
]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "PTH"]
ignore = [
    "E501",   # formatter handles line length
    "B008",   # Typer's Option()/Argument() defaults are the documented idiom
    "SIM108", # explicit if/else is often clearer
    "PTH123", # open() is fine alongside pathlib
    "PTH101", "PTH105", "PTH116", "PTH211",  # os.chmod/replace/stat/symlink are clearer for permissions
    "C408",   # dict(...) reads better for keyword-heavy records
    "SIM105", # explicit try/except/pass is fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
files = ["src/efgpp"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["efgpp"]
